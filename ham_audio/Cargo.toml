[package]
name    = "ham_audio"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "ham_audio"
path = "src/main.rs"

[dependencies]
cpal              = "0.15"
opus              = { version = "0.3", default-features = false, features = [] }
tokio             = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
tokio-rustls      = "0.25"
rustls-pemfile    = "2"
futures-util      = "0.3"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes             = "1"
rustfft           = "6"
rayon             = "1"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
